[package]
name = "yamusiq"
version = "1.2.0"
edition = "2024"
description = "Keyboard-first Yandex Music client for the terminal: TUI player, lossless streaming, local library"
license = "MIT"
repository = "https://github.com/razil3/yamusiq"
readme = "README.md"
keywords = ["yandex-music", "music", "tui", "terminal", "player"]
categories = ["command-line-utilities", "multimedia::audio"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "README.en.md", "docs/preview-*.png"]

[dependencies]
anyhow = "1"
base64 = "0.23.1"
cpal = "0.18.2"
crossterm = "0.29"
hmac = "0.13.0"
libc = "0.2"
md-5 = "0.11.0"
ratatui = "0.29"
rpassword = "7.5.5"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
url = "2"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
