name: release

# Tagging still publishes a release. Packaging is the same as local dist.sh.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust and both macOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check tag matches Cargo version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build, bundle and smoke-test all release archives
        run: sh scripts/dist.sh --output "$RUNNER_TEMP/release-dist"

      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: |
            ${{ runner.temp }}/release-dist/*.tar.gz
            ${{ runner.temp }}/release-dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "" \
            dist/*.tar.gz dist/SHA256SUMS
